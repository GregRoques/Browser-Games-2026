<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teddy Tales</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&family=Pacifico&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="header-bar">
    <a href="/" class="home-icon" aria-label="Home">
      <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 9.5L12 3l9 6.5V20a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9.5z"/>
        <polyline points="9 22 9 12 15 12 15 22"/>
      </svg>
    </a>
    <h1 class="site-title">Teddy Tales</h1>
  </header>

  <main class="container">
    <div id="stories" class="row g-4"></div>

    <div id="spinner" class="text-center py-4 d-none">
      <div class="loading-spinner"></div>
      <p class="loading-text">Loading more stories...</p>
    </div>

    <div id="sentinel"></div>
  </main>

  <script src="js/app.js"></script>
</body>
</html>
