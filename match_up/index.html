<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="nofollow, noindex, noimageindex">
    <title>Heart Girl Match Up</title>
    <link rel="icon" type="image/png" href="Images/hg-favicon.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- Popup Overlay -->
    <div class="popup-overlay active" id="popupOverlay">
        <div class="popup-box">
            <div class="popup-text-section">
                <p class="popup-typed-text" id="popupTypedText"></p>
                <div class="popup-continue hidden" id="popupContinue">
                    <span class="continue-keyboard">Press Return to continue</span>
                    <button class="continue-touch btn btn-continue" type="button">Continue</button>
                </div>
            </div>
            <div class="popup-image-section">
                <img src="Images/heart-girl.png" alt="Heart Girl" class="popup-img"
                     onerror="this.style.display='none';">
            </div>
        </div>
    </div>

    <!-- Heart Match Animation -->
    <div class="heart-pop" id="heartPop" aria-hidden="true">&#9829;</div>

    <!-- Game Container -->
    <div class="container-fluid game-container" id="gameContainer">
        <!-- Header -->
        <div class="game-header mx-auto">
            <div class="header-inner">
                <img src="Images/heart-girl.png" alt="Heart Girl" class="header-img"
                     onerror="this.style.display='none';">
                <h1 class="game-title text-center">&#9829; Match Up &#9829;</h1>
                <div class="metrics d-flex justify-content-center gap-3 mt-2">
                    <div class="metric-box text-center">
                        <div class="metric-label">Moves</div>
                        <div class="metric-value" id="movesDisplay">0</div>
                    </div>
                    <div class="metric-box text-center">
                        <div class="metric-label">Time</div>
                        <div class="metric-value" id="timeDisplay">0:00</div>
                    </div>
                    <div class="metric-box text-center">
                        <div class="metric-label">Matches</div>
                        <div class="metric-value" id="matchesDisplay">0/8</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Card Grid -->
        <div class="card-grid mx-auto" id="cardGrid"></div>
    </div>

    <script src="app.js"></script>
</body>
</html>
